<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox Basics</title>

    <link rel="stylesheet" href="css/flexbox-basics.css">
</head>

<body>

    <h1>CSS Flexbox Basics</h1>

    <p>
        Flexbox is a CSS layout system used to arrange elements
        inside a container.
    </p>

    <hr>

    <!-- Basic Flex Container -->

    <h2>1. Basic Flexbox</h2>

    <div class="container">

        <div class="box box-one">
            Box 1
        </div>

        <div class="box box-two">
            Box 2
        </div>

        <div class="box box-three">
            Box 3
        </div>

    </div>

    <hr>

    <!-- Flexbox with Text -->

    <h2>2. Flexbox with Content</h2>

    <div class="content-container">

        <div class="content-box">
            <p>Lorem ipsum</p>
        </div>

        <div class="content-box">
            <p>Lorem ipsum</p>
        </div>

        <div class="content-box">
            <p>Lorem ipsum</p>
        </div>

    </div>

</body>

</html>
